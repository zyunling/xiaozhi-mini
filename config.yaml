# ============================================================
# xiaozhi-mini v2.4 配置
# 改完这个文件后 docker restart xiaozhi-mini 生效
# token 请在 .env 文件中配置（XIAOZHI_TOKEN=xxx）
# ============================================================

xiaozhi:
  # 小智 MCP 服务 base URL（一般不用改）
  base_url: "wss://api.xiaozhi.me/mcp/"
  # 1006 空闲超时后的重连延迟（ms），默认 3s
  # reconnect_delay: 3000
  # 重连最大延迟（ms），默认 60s
  # reconnect_max_delay: 60000
  # 是否启用 WebSocket 协议层 ping/pong 心跳保活（默认 true）
  # 注意：如果服务端不支持客户端 ping，会自动降级
  # enable_heartbeat: true
  # 心跳间隔（ms），默认 25s（需小于服务端超时时间）
  # heartbeat_interval: 25000
  # 心跳超时（ms），默认 10s，超时未收到 pong 则认为连接已断开
  # heartbeat_timeout: 10000
  # 是否启用 listTools 应用层保活（默认 false）
  # 当 ping 不可用时，通过定期调用 tools/list 维持连接活性
  # enable_listtools_keepalive: false
  # 消息队列最大长度，断开期间缓存的消息数上限（默认 100）
  # message_queue_max: 100
  #
  # 如需要完整 URL 覆盖（不推荐，token 会写在配置里），可取消下一行注释：
  # url: "wss://api.xiaozhi.me/mcp/?token=YOUR_TOKEN"

upstreams:
  # ── HA-MCP（你的空调/灯光/传感器）──────────────────────
  ha:
    type: streamable-http
    url: "http://192.168.199.8:9583/REPLACE_WITH_YOUR_TOKEN"
    headers:
      Accept: "application/json, text/event-stream"

  # ── 下面是示例，取消注释就能用 ──────────────────────────

  memory:
    type: stdio
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: /workspaces/memory.jsonl

  # 示例1：Tavily 搜索（需要 API Key）
  # tavily:
  #   type: streamable-http
  #   url: "https://api.tavily.com/mcp"
  #   headers:
  #     Authorization: "Bearer ${TAVILY_API_KEY}"

  # 示例2：Sequential Thinking（本地 stdio 进程）
  # sequential:
  #   type: stdio
  #   command: "npx"
  #   args: ["-y", "@anthropic-ai/sequential-thinking"]

  # 示例3：文件系统（本地 stdio 进程）
  # filesystem:
  #   type: stdio
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

  # 示例4：高德地图（需要 API Key）
  # amap:
  #   type: streamable-http
  #   url: "https://mcp.amap.com/mcp?key=YOUR_AMAP_KEY"
