# ============================================================
# xiaozhi-mini v2.5 配置
# 改完这个文件后 docker restart xiaozhi-mini 生效
# token 请在 .env 文件中配置（XIAOZHI_TOKEN=xxx）
# ============================================================

xiaozhi:
  # 小智 MCP 服务 base URL（一般不用改）
  base_url: "wss://api.xiaozhi.me/mcp/"
  # 快速重连延迟（ms），默认 2s
  # reconnect_delay: 2000
  # 快速重连最大延迟（ms），默认 60s
  # reconnect_max_delay: 60000
  # 是否启用快速重连模式（默认 true）
  # 启用后：固定间隔快速重连，适合小智官方 endpoint
  # 关闭后：指数退避 → 无限重连 → 休眠模式
  # aggressive_reconnect: true
  # 快速重连最大尝试次数（默认 10）
  # max_quick_reconnect: 10
  # 无限重连间隔（ms），默认 30 分钟
  # infinite_reconnect_delay: 1800000
  # 无限重连最大次数（默认 48，约 24 小时），0 表示不限
  # max_infinite_retries: 48
  # 进入休眠模式前的失败次数（默认 12）
  # sleep_threshold: 12
  # 休眠间隔（ms），默认 2 小时
  # sleep_interval: 7200000
  # 消息队列最大长度，断开期间缓存的消息数上限（默认 100）
  # message_queue_max: 100
  #
  # 如需要完整 URL 覆盖（不推荐，token 会写在配置里），可取消下一行注释：
  # url: "wss://api.xiaozhi.me/mcp/?token=YOUR_TOKEN"

upstreams:
  # ── HA-MCP（你的空调/灯光/传感器）──────────────────────
  ha:
    type: streamable-http
    url: "http://192.168.199.8:9583/REPLACE_WITH_YOUR_TOKEN"
    headers:
      Accept: "application/json, text/event-stream"

  # ── 下面是示例，取消注释就能用 ──────────────────────────

  memory:
    type: stdio
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: /workspaces/memory.jsonl

  # 示例1：Tavily 搜索（需要 API Key）
  # tavily:
  #   type: streamable-http
  #   url: "https://api.tavily.com/mcp"
  #   headers:
  #     Authorization: "Bearer ${TAVILY_API_KEY}"

  # 示例2：Sequential Thinking（本地 stdio 进程）
  # sequential:
  #   type: stdio
  #   command: "npx"
  #   args: ["-y", "@anthropic-ai/sequential-thinking"]

  # 示例3：文件系统（本地 stdio 进程）
  # filesystem:
  #   type: stdio
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

  # 示例5：云端闹钟（倒计时/定时/重复）
  # alarm:
  #   type: stdio
  #   command: "node"
  #   args: ["alarm-server.mjs"]
  #   cwd: /app
  #   env:
  #     ALARM_DATA_DIR: /app/data

  # 示例4：高德地图（需要 API Key）
  # amap:
  #   type: streamable-http
  #   url: "https://mcp.amap.com/mcp?key=YOUR_AMAP_KEY"
