# ============================================================
# xiaozhi-mini v2.6 配置
# 改完 .env 后 docker compose restart 生效
# 所有 token/url 在 .env 文件中配置，此文件一般不用改
# ============================================================

xiaozhi:
  # 单个接入：从 .env 读取完整 wss URL
  url: "${XIAOZHI_URL}"

  # 多个接入（可选，取消注释即可同时连接多个小智）：
  # urls:
  #   - "${XIAOZHI_URL_1}"
  #   - "${XIAOZHI_URL_2}"

  # ── 重连参数（一般不用改）──────────────────────────────
  # 快速重连延迟（ms），默认 2s
  # reconnect_delay: 2000
  # 是否启用快速重连模式（默认 true）
  # aggressive_reconnect: true
  # 快速重连最大尝试次数（默认 10）
  # max_quick_reconnect: 10
  # 无限重连间隔（ms），默认 30 分钟
  # infinite_reconnect_delay: 1800000
  # 无限重连最大次数（默认 48，约 24 小时），0 表示不限
  # max_infinite_retries: 48
  # 进入休眠模式前的失败次数（默认 12）
  # sleep_threshold: 12
  # 休眠间隔（ms），默认 2 小时
  # sleep_interval: 7200000
  # 消息队列最大长度，断开期间缓存的消息数上限（默认 100）
  # message_queue_max: 100

upstreams:
  # ── Home Assistant（空调/灯光/传感器）──────────────────
  # 完整地址在 .env 中配置：HA_MCP_URL=http://IP:PORT/TOKEN
  #
  # ⚠️ 重要：ha-mcp 新版本已扩展到 77+ 个工具（约 176KB），远超小智
  # WebSocket 40KB 消息上限。不过滤会被强制截断，且排在前面的都是
  # 插件/区域/自动化等管理类工具，查询和控制设备的核心工具反而被丢掉
  # （这就是"小智后台丢失几乎所有 HA 工具"的原因）。
  # 下面的 include 白名单只保留语音控制需要的 10 个核心工具：
  #   查设备(ha_search/ha_get_state/ha_get_entity)、控设备(ha_call_service/
  #   ha_bulk_control/ha_get_operation_status)、查历史(ha_get_history)、
  #   模板计算(ha_eval_template)、服务发现(ha_list_services)、总览(ha_get_overview)
  # 如需增减，直接改这个列表（填上游原始工具名，不带 ha_ 前缀）
  ha:
    type: streamable-http
    url: "${HA_MCP_URL}"
    headers:
      Accept: "application/json, text/event-stream"
    include:
      - ha_search                # 按自然语言搜索实体/设备
      - ha_get_state             # 查询设备状态
      - ha_call_service          # 调用服务（开关灯/空调等）
      - ha_bulk_control          # 批量控制多个设备
      - ha_get_operation_status  # 查询批量操作结果
      - ha_get_overview          # 全屋概览
      - ha_get_entity            # 实体详情
      - ha_get_history           # 历史数据查询
      - ha_eval_template         # 模板计算（"哪个房间最热"类问题）
      - ha_list_services         # 列出可用服务

  # ── 知识图谱长期记忆 ──────────────────────────────────
  memory:
    type: stdio
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: /workspaces/memory.jsonl

  # ── Tavily 搜索 ───────────────────────────────────────
  # API Key 在 .env 中配置：TAVILY_API_KEY=your_key
  tavily:
    type: streamable-http
    url: "https://mcp.tavily.com/mcp/?tavilyApiKey=${TAVILY_API_KEY}"
    headers:
      Accept: "application/json, text/event-stream"

  # ── Navidrome 音乐库（MCP 工具，绕开固件音源配置）─────────
  # 启动 navidrome-mcp-server 后，小智云端 AI 可直接调用：
  #   navidrome_search(query)            — 搜索歌曲
  #   navidrome_get_stream_url(id)      — 获取播放流URL
  #   navidrome_random_song(size)       — 随机推荐
  # 然后用 self.music.play_url 播放，不需要固件音源配置
  # navidrome:
  #   type: streamable-http
  #   url: "http://127.0.0.1:8660/mcp/"
  #   headers:
  #     Accept: "application/json, text/event-stream"

  # ── 以下为可选，取消注释即可启用 ──────────────────────

  # 必应中文搜索（stdio，约 40-50MB 内存，已用 Tavily 可不开）
  # bing-search:
  #   type: stdio
  #   command: "npx"
  #   args: ["-y", "bing-cn-mcp"]

  # Sequential Thinking（本地 stdio 进程）
  # sequential:
  #   type: stdio
  #   command: "npx"
  #   args: ["-y", "@anthropic-ai/sequential-thinking"]

  # 文件系统（本地 stdio 进程）
  # filesystem:
  #   type: stdio
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

  # 高德地图（需要 API Key）
  # amap:
  #   type: streamable-http
  #   url: "https://mcp.amap.com/mcp?key=YOUR_AMAP_KEY"
