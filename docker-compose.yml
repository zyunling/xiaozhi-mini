services:
  xiaozhi-mini:
    build: .
    container_name: xiaozhi-mini
    restart: unless-stopped

    # 从 .env 文件读取环境变量（含小智 token）
    env_file:
      - .env

    # 挂载配置（改 config.yaml 后 restart 生效）
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./memory-data:/workspaces

    # 内存限制：每个 stdio upstream（npx）是独立 Node 子进程，约 40-50MB/个
    # 主进程 ~60MB + 2 个 stdio 子进程 ~90MB ≈ 150-180MB，256M 留足余量
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M