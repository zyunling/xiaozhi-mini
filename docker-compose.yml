services:
  xiaozhi-mini:
    build: .
    container_name: xiaozhi-mini
    restart: unless-stopped

    # 从 .env 文件读取环境变量（含小智 token）
    env_file:
      - .env

    # 挂载配置（改 config.yaml 后 restart 生效）
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./memory-data:/workspaces

    # 内存限制：默认 1 个 stdio（memory）+ 主进程 ≈ 110MB，192M 留足余量
    # 每多开一个 stdio upstream 约增加 40-50MB，按需调大
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M