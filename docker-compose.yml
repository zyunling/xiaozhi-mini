services:
  xiaozhi-mini:
    build: .
    container_name: xiaozhi-mini
    restart: unless-stopped

    # 挂载配置（改 config.yaml 后 restart 生效）
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./memory-data:/workspaces

    # 内存限制（128MB 绰绰有余）
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M